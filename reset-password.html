<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <title>Đặt lại mật khẩu | Quản trị</title>
    <link rel="stylesheet" href="assets/admin-account.css?v=20260908-account">
</head>
<body class="password-recovery-page">
    <main class="account-card password-recovery-card">
        <h1>Đặt lại mật khẩu</h1>
        <p class="account-muted">Tạo mật khẩu mới để đăng nhập lại tài khoản của bạn.</p>
        <p id="recoveryStatus" class="account-status" role="status" aria-live="polite">Đang kiểm tra liên kết...</p>
        <form id="recoveryForm" class="account-form" hidden>
            <fieldset id="recoveryFields">
                <label for="recoveryPassword">Mật khẩu mới</label><input id="recoveryPassword" type="password" required minlength="8" maxlength="256" autocomplete="new-password" aria-describedby="recoveryPasswordHelp">
                <p id="recoveryPasswordHelp" class="account-muted">Ít nhất 8 ký tự. Nên kết hợp chữ, số và ký hiệu.</p>
                <label for="recoveryConfirmation">Nhập lại mật khẩu mới</label><input id="recoveryConfirmation" type="password" required minlength="8" maxlength="256" autocomplete="new-password">
                <button id="recoverySubmit" class="account-button" type="submit">Lưu mật khẩu mới</button>
            </fieldset>
        </form>
        <a class="account-back-link" href="admin.html">← Quay lại đăng nhập</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="assets/admin-account.js?v=20260908-account"></script>
    <script>
    (function () {
        "use strict";
        const form = document.getElementById("recoveryForm");
        const status = document.getElementById("recoveryStatus");
        const params = new URLSearchParams(location.hash.slice(1));
        const query = new URLSearchParams(location.search);
        const code = query.get("code");
        const recoveryLink = params.get("type") === "recovery" || query.get("type") === "recovery" || Boolean(code);
        const accessToken = params.get("access_token");
        const refreshToken = params.get("refresh_token");
        const tokenHash = query.get("token_hash");
        const linkError = params.get("error") || query.get("error") || params.get("error_code") || query.get("error_code");
        history.replaceState(null, "", location.pathname);
        let client, validUserId = null, busy = false;
        function fail(message) { status.textContent = message; status.dataset.success = "false"; form.hidden = true; validUserId = null; }
        async function verify() {
            if (!window.supabase || !window.AdminAccount) { fail("Không tải được chức năng đặt lại mật khẩu. Hãy kiểm tra kết nối rồi mở lại liên kết trong email."); return; }
            if (linkError || !recoveryLink || (!code && !tokenHash && (!accessToken || !refreshToken))) { fail("Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Hãy quay lại đăng nhập và chọn Quên mật khẩu để nhận liên kết mới."); return; }
            // PKCE uses the original client storage key to retrieve its verifier.
            const auth = code ? { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false } : { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "math-admin-password-recovery" };
            client = window.supabase.createClient("https://uiyqdqucqplifcvukwul.supabase.co", "sb_publishable_eVPODZoNRLiGD8Ldl2VjAg_eC_KTKDg", { auth });
            try {
                const result = code ? await client.auth.exchangeCodeForSession(code) : tokenHash ? await client.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" }) : await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                if (result.error) throw result.error;
                const { data, error } = await client.auth.getUser();
                if (error || !data?.user) throw error || new Error("Missing user");
                validUserId = data.user.id;
                status.textContent = "Liên kết hợp lệ. Bạn có thể tạo mật khẩu mới.";
                status.dataset.success = "true";
                form.hidden = false;
            } catch (error) { fail("Liên kết đã hết hạn hoặc đã được sử dụng. Hãy yêu cầu một liên kết đặt lại mật khẩu mới."); }
        }
        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (busy || !validUserId || !form.reportValidity()) return;
            const password = document.getElementById("recoveryPassword").value;
            const problem = window.AdminAccount.validPassword(password, document.getElementById("recoveryConfirmation").value);
            if (problem) { status.textContent = problem; status.dataset.success = "false"; return; }
            busy = true;
            document.getElementById("recoveryFields").disabled = true;
            status.textContent = "Đang lưu mật khẩu mới...";
            try {
                const { data, error: userError } = await client.auth.getUser();
                if (userError || data?.user?.id !== validUserId) { fail("Phiên đặt lại mật khẩu đã hết hạn. Hãy yêu cầu liên kết mới."); return; }
                const { error } = await client.auth.updateUser({ password });
                if (error) throw error;
                form.reset();
                form.hidden = true;
                validUserId = null;
                status.textContent = "Đã đặt lại mật khẩu. Bạn có thể quay lại trang quản trị để đăng nhập bằng mật khẩu mới.";
                status.dataset.success = "true";
                const { error: signOutError } = await client.auth.signOut({ scope: "local" });
                if (signOutError) status.textContent += " Hãy đăng xuất phiên hiện tại trước khi đăng nhập lại.";
            } catch (error) { status.textContent = window.AdminAccount.passwordError(error); status.dataset.success = "false"; }
            finally { busy = false; document.getElementById("recoveryFields").disabled = false; }
        });
        verify();
    }());
    </script>
</body>
</html>
