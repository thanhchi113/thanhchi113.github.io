<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị tài liệu | Huỳnh Thanh Chí</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
.admin-page{min-height:100vh;padding:108px 0 70px;position:relative;z-index:2}.admin-shell{display:grid;grid-template-columns:340px 1fr;gap:22px}.admin-card{background:linear-gradient(145deg,rgba(14,23,42,.82),rgba(7,12,24,.76));border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.admin-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.admin-title h1{font-size:30px;line-height:1.1}.admin-title p{color:#8798b0;margin-top:7px;font-size:14px}.admin-form{display:grid;gap:13px}.admin-form label{font-size:12px;color:#a8b6c9;font-weight:700;letter-spacing:.6px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;background:rgba(5,10,19,.7);border:1px solid rgba(148,163,184,.18);color:#f1f7ff;border-radius:10px;padding:12px 13px;font:inherit;outline:none}.admin-form textarea{min-height:95px;resize:vertical}.admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus{border-color:rgba(125,211,252,.5)}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.admin-btn{border:1px solid rgba(96,165,250,.26);background:rgba(56,189,248,.09);color:#eaf7ff;border-radius:10px;padding:11px 14px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:8px}.admin-btn:hover{transform:translateY(-1px);border-color:rgba(125,211,252,.55)}.admin-btn.danger{color:#fecaca;background:rgba(239,68,68,.08);border-color:rgba(248,113,113,.16)}.admin-btn.ghost{background:rgba(255,255,255,.03);color:#cbd5e1;border-color:rgba(255,255,255,.09)}.admin-status{margin-top:10px;min-height:20px;color:#8ea0b8;font-size:13px}.admin-login{max-width:460px;margin:50px auto}.admin-login .admin-card{padding:28px}.admin-list{display:grid;gap:12px}.admin-doc{padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)}.admin-doc-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}.admin-doc h3{font-size:17px;margin-bottom:4px}.admin-doc p{color:#8393aa;font-size:13px}.admin-doc-meta{font-size:12px;color:#6f8097;margin-top:7px}.admin-row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.admin-row-actions button{min-width:38px;height:38px;padding:0 11px}.admin-authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:11px 13px;border-radius:12px;background:rgba(56,189,248,.05);border:1px solid rgba(125,211,252,.12);color:#b9c8da;font-size:13px}.admin-user{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hidden{display:none!important}.admin-section-title{margin:25px 0 13px;font-size:15px;color:#dbeafe}.file-name{color:#7dd3fc;font-size:12px;word-break:break-all}.admin-drop{border:1px dashed rgba(125,211,252,.25);padding:16px;border-radius:12px;background:rgba(56,189,248,.03)}.admin-drop input{cursor:pointer}.admin-nav{position:fixed;top:0;left:0;width:100%;z-index:1500;height:76px;background:rgba(7,11,20,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}.admin-nav .container{height:76px;display:flex;align-items:center;justify-content:space-between}.admin-nav a{color:#dcecff}.admin-nav .back{font-size:14px;color:#9fb0c8}.check-row{display:flex;align-items:center;gap:8px;color:#b8c6d8;font-size:13px}.check-row input{width:auto}.category-manager{display:grid;gap:9px}.category-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.category-line input{min-width:0}.category-line button{height:43px;padding:0 12px}.muted{color:#73839a;font-size:12px}@media(max-width:980px){.admin-shell{grid-template-columns:1fr}.admin-doc-main{grid-template-columns:1fr}.admin-row-actions{justify-content:flex-start}}@media(max-width:600px){.admin-page{padding-top:95px}.admin-title{align-items:flex-start;flex-direction:column}.admin-card{padding:17px}}
</style>
</head>
<body>
<header class="admin-nav"><div class="container"><a class="logo" href="index.html">Thanh<span>Chí</span></a><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Về website</a></div></header>
<main class="admin-page"><div class="container">
<div id="loginPanel" class="admin-login"><div class="admin-card"><div class="admin-title"><div><h1>Đăng nhập</h1><p>Khu vực quản trị thư viện tài liệu</p></div><i class="fa-solid fa-shield-halved" style="font-size:30px;color:#7dd3fc"></i></div>
<form id="loginForm" class="admin-form"><div><label>Email</label><input id="loginEmail" type="email" required autocomplete="email"></div><div><label>Mật khẩu</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="admin-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button><div id="loginStatus" class="admin-status"></div></form>
</div></div>
<div id="adminPanel" class="hidden">
<div class="admin-authbar"><div class="admin-user" id="userEmail"></div><button class="admin-btn ghost" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button></div>
<div class="admin-shell">
<section class="admin-card"><div class="admin-title"><div><h1 id="formTitle">Thêm tài liệu</h1><p>Upload PDF và chỉnh mục lục mà không sửa code.</p></div></div>
<form id="docForm" class="admin-form"><input type="hidden" id="docId"><input type="hidden" id="oldFilePath">
<div><label>Tiêu đề</label><input id="title" required placeholder="Ví dụ: Chuyên đề Đạo hàm"></div>
<div><label>Mô tả</label><textarea id="description" placeholder="Mô tả ngắn về tài liệu..."></textarea></div>
<div><label>Danh mục</label><select id="categoryId" required></select></div>
<div><label>Thứ tự</label><input id="sortOrder" type="number" value="0" min="0"></div>
<div><label>Tệp PDF</label><div class="admin-drop"><input id="fileInput" type="file" accept="application/pdf"><div id="selectedFile" class="file-name"></div><div class="muted" style="margin-top:7px">Khuyến nghị PDF nhỏ hơn khoảng 6 MB cho upload tiêu chuẩn.</div></div></div>
<label class="check-row"><input id="published" type="checkbox" checked> Hiển thị trên website</label>
<div class="admin-actions"><button class="admin-btn" type="submit"><i class="fa-solid fa-cloud-arrow-up"></i> <span id="saveLabel">Lưu tài liệu</span></button><button class="admin-btn ghost" type="button" id="resetBtn">Làm mới</button></div><div id="formStatus" class="admin-status"></div></form>
<div class="admin-section-title">Quản lý danh mục</div><div class="muted" style="margin-bottom:8px">Bạn có thể thêm danh mục mới tại đây.</div><div class="category-manager"><div class="category-line"><input id="newCategoryName" placeholder="Tên danh mục mới"><button class="admin-btn" id="addCategoryBtn" type="button"><i class="fa-solid fa-plus"></i></button></div><div id="categoryStatus" class="admin-status"></div></div>
</section>
<section class="admin-card"><div class="admin-title"><div><h1>Tài liệu đã đăng</h1><p id="countText">Đang tải...</p></div></div><div id="adminList" class="admin-list"></div></section>
</div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uiyqdqucqplifcvukwul.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eVPODZoNRLiGD8Ldl2VjAg_eC_KTKDg";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const state = { categories: [], documents: [], editing: null };
const $ = id => document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function pdfUrl(path){return `${SUPABASE_URL}/storage/v1/object/public/math-pdfs/${path.split('/').map(encodeURIComponent).join('/')}`;}
function setStatus(id,msg,ok=false){const el=$(id);if(el){el.textContent=msg;el.style.color=ok?'#86efac':'#8ea0b8';}}
async function checkAdmin(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return false;} const {data:profile,error}=await supabaseClient.from('profiles').select('role').eq('id',user.id).single(); if(error||profile?.role!=='admin'){setStatus('loginStatus','Tài khoản này chưa được cấp quyền quản trị.');await supabaseClient.auth.signOut();return false;} $('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('userEmail').textContent=user.email||'Đã đăng nhập'; await loadAll(); return true;}
async function loadCategories(){const {data,error}=await supabaseClient.from('math_categories').select('id,name,slug,description,sort_order').order('sort_order'); if(error){setStatus('formStatus','Không tải được danh mục.');return;} state.categories=data||[]; $('categoryId').innerHTML=state.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');}
async function loadDocs(){const {data,error}=await supabaseClient.from('math_documents').select('id,title,description,category_id,file_path,file_name,sort_order,published,created_at,updated_at,math_categories(name,slug)').order('sort_order').order('created_at',{ascending:false}); if(error){setStatus('formStatus','Không tải được danh sách tài liệu.');return;} state.documents=data||[]; renderDocs();}
function renderDocs(){ $('countText').textContent=`${state.documents.length} tài liệu`; $('adminList').innerHTML=state.documents.map(d=>`<article class="admin-doc"><div class="admin-doc-main"><div><h3>${esc(d.title)}</h3><p>${esc(d.description||'Không có mô tả.')}</p><div class="admin-doc-meta">${esc(d.math_categories?.name||'Chưa phân loại')} · ${d.published?'Đang hiển thị':'Đang ẩn'} · thứ tự ${d.sort_order}</div></div><div class="admin-row-actions"><button class="admin-btn ghost" data-edit="${d.id}" title="Sửa"><i class="fa-solid fa-pen"></i></button><a class="admin-btn ghost" href="${esc(pdfUrl(d.file_path))}" target="_blank" rel="noopener noreferrer" title="Xem PDF"><i class="fa-solid fa-eye"></i></a><button class="admin-btn danger" data-delete="${d.id}" title="Xóa"><i class="fa-solid fa-trash"></i></button></div></div></article>`).join(''); document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>startEdit(Number(b.dataset.edit)))); document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteDoc(Number(b.dataset.delete)))); }
function resetForm(){state.editing=null;$('docId').value='';$('oldFilePath').value='';$('formTitle').textContent='Thêm tài liệu';$('saveLabel').textContent='Lưu tài liệu';$('docForm').reset();$('sortOrder').value='0';$('published').checked=true;$('selectedFile').textContent='';setStatus('formStatus','');}
function startEdit(id){const d=state.documents.find(x=>x.id===id);if(!d)return;state.editing=id;$('docId').value=d.id;$('oldFilePath').value=d.file_path;$('title').value=d.title;$('description').value=d.description||'';$('categoryId').value=d.category_id||'';$('sortOrder').value=d.sort_order??0;$('published').checked=!!d.published;$('selectedFile').textContent=`Tệp hiện tại: ${d.file_name}`;$('formTitle').textContent='Sửa tài liệu';$('saveLabel').textContent='Cập nhật';window.scrollTo({top:0,behavior:'smooth'});}
async function uploadFile(file, existingPath){if(!file)return existingPath||null; if(file.type!=='application/pdf')throw new Error('Chỉ chấp nhận PDF.'); const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'); const path=`uploads/${Date.now()}-${crypto.randomUUID()}-${safe}`; const {error}=await supabaseClient.storage.from('math-pdfs').upload(path,file,{contentType:'application/pdf',upsert:false});if(error)throw error;if(existingPath){await supabaseClient.storage.from('math-pdfs').remove([existingPath]);}return path;}
async function saveDoc(e){e.preventDefault();setStatus('formStatus','Đang xử lý...');try{const file=$('fileInput').files[0];const current=state.editing?state.documents.find(x=>x.id===state.editing):null; if(!state.editing&&!file)throw new Error('Hãy chọn một file PDF.');const path=await uploadFile(file,current?.file_path);const payload={title:$('title').value.trim(),description:$('description').value.trim()||null,category_id:Number($('categoryId').value)||null,file_path:path,file_name:file?file.name:(current?.file_name||''),sort_order:Number($('sortOrder').value)||0,published:$('published').checked,updated_at:new Date().toISOString()}; if(state.editing){const {error}=await supabaseClient.from('math_documents').update(payload).eq('id',state.editing);if(error)throw error;setStatus('formStatus','Đã cập nhật tài liệu.',true);}else{const {error}=await supabaseClient.from('math_documents').insert(payload);if(error)throw error;setStatus('formStatus','Đã thêm tài liệu.',true);}await loadDocs();resetForm();}catch(err){setStatus('formStatus',err.message||'Có lỗi xảy ra.');}}
async function deleteDoc(id){const d=state.documents.find(x=>x.id===id);if(!d||!confirm(`Xóa tài liệu “${d.title}”?`))return;setStatus('formStatus','Đang xóa...');const {error}=await supabaseClient.from('math_documents').delete().eq('id',id);if(error){setStatus('formStatus',error.message);return;}await supabaseClient.storage.from('math-pdfs').remove([d.file_path]);await loadDocs();setStatus('formStatus','Đã xóa tài liệu.',true);if(state.editing===id)resetForm();}
async function addCategory(){const name=$('newCategoryName').value.trim();if(!name)return;const slug='cat-'+Date.now();const sort=(Math.max(0,...state.categories.map(x=>Number(x.sort_order)||0))+10);const {error}=await supabaseClient.from('math_categories').insert({name,slug,sort_order:sort});if(error){setStatus('categoryStatus',error.message);return;} $('newCategoryName').value='';setStatus('categoryStatus','Đã thêm danh mục.',true);await loadCategories();}
async function loadAll(){await loadCategories();await loadDocs();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();setStatus('loginStatus','Đang đăng nhập...');const {error}=await supabaseClient.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error){setStatus('loginStatus',error.message);return;}await checkAdmin();});
$('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut();location.reload();});$('docForm').addEventListener('submit',saveDoc);$('resetBtn').addEventListener('click',resetForm);$('fileInput').addEventListener('change',()=>{$('selectedFile').textContent=$('fileInput').files[0]?.name||''});$('addCategoryBtn').addEventListener('click',addCategory);supabaseClient.auth.onAuthStateChange(()=>checkAdmin());checkAdmin();
</script></body></html>
